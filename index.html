<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Bonjour, ma’am.</title>
<meta name="description" content="Something has been waiting for you." />
<meta property="og:title" content="Bonjour, ma’am." />
<meta property="og:description" content="Something has been waiting for you." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ivory:#fff8ec;
    --gold:#e8c67e;
    --display:"Cormorant Garamond","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:#05060d; color:var(--ivory);
    overflow:hidden; overscroll-behavior:none;
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
  }
  body{
    touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- the one tap ---------- */
  #intro{
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; cursor:pointer;
    transition:opacity 1.1s ease, transform 1.6s ease, filter 1.1s ease;
  }
  #intro.gone{ opacity:0; transform:scale(1.12); filter:blur(10px); pointer-events:none; }
  #intro h1{
    margin:0;
    font-weight:600;
    font-size:clamp(2.8rem, 11vw, 5.6rem);
    line-height:1.05;
    color:var(--ivory);
    text-shadow:0 0 40px rgba(232,198,126,.35), 0 4px 18px rgba(0,0,0,.6);
    opacity:0; animation:rise 1.8s .3s cubic-bezier(.2,.8,.2,1) forwards;
  }
  #begin{
    position:relative;
    margin-top:clamp(40px, 8vh, 72px);
    font:inherit; font-weight:700;
    font-size:clamp(1.15rem, 4.6vw, 1.45rem);
    letter-spacing:.2em; text-transform:uppercase;
    color:#24170a;
    background:linear-gradient(135deg, #fbe9bb, #e8c67e 50%, #c9963f);
    border:0; border-radius:999px;
    padding:20px 46px 19px;
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,244,214,.6) inset, 0 12px 44px rgba(232,198,126,.45);
    opacity:0; animation:rise 1.3s 1.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  #begin::before, #begin::after{
    content:""; position:absolute; inset:-8px; border-radius:inherit;
    border:2px solid rgba(232,198,126,.7);
    opacity:0; animation:ring 2.4s 2.8s ease-out infinite;
  }
  #begin::after{ animation-delay:4s; }
  @keyframes ring{
    0%{ opacity:.9; transform:scale(.94); }
    100%{ opacity:0; transform:scale(1.4); }
  }
  #intro .note{
    margin:26px 0 0;
    font-size:clamp(1.05rem, 3.8vw, 1.25rem);
    font-weight:500; letter-spacing:.06em;
    color:rgba(255,248,236,.75);
    opacity:0; animation:rise 1.3s 2.1s forwards;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }

  /* ---------- the gate ---------- */
  #gate{
    position:fixed; left:50%; bottom:13vh; z-index:6;
    width:min(560px, 86vw); aspect-ratio:400/420;
    display:flex; perspective:1400px;
    transform:translateX(-50%) scale(.82);
    opacity:0; pointer-events:none;
    transition:opacity 1.2s ease, transform 2.4s cubic-bezier(.2,.8,.2,1);
  }
  #gate.show{ opacity:1; transform:translateX(-50%) scale(1); }
  #gate.gone{ opacity:0; transform:translateX(-50%) scale(1.7); transition:opacity 1.1s ease, transform 1.6s ease-in; }
  #gate::before{
    content:""; position:absolute; inset:4% 3% 0;
    background:radial-gradient(ellipse at 50% 72%, #fffbe8, #ffd98a 32%, rgba(255,170,70,0) 72%);
    filter:blur(4px); opacity:0; transition:opacity 1.2s ease;
  }
  #gate.open::before{ opacity:1; }
  #gate .door{ position:relative; flex:1; height:100%; transition:transform 2s cubic-bezier(.6,.04,.3,1); }
  #gate .door.l{ transform-origin:0% 50%; }
  #gate .door.r{ transform-origin:100% 50%; }
  #gate .door.r svg{ transform:scaleX(-1); }
  #gate.open .door.l{ transform:rotateY(-108deg); }
  #gate.open .door.r{ transform:rotateY(108deg); }
  #gate svg{ display:block; width:100%; height:100%; filter:drop-shadow(0 0 10px rgba(232,198,126,.35)); }

  /* ---------- the words ---------- */
  #verse-wrap{
    position:fixed; left:50%; top:28%; z-index:12;
    width:min(920px, 90vw);
    transform:translate(-50%, -50%);
    text-align:center; pointer-events:none;
  }
  #verse-wrap::before{
    content:""; position:absolute; left:50%; top:50%; z-index:-1;
    width:125%; height:230%;
    transform:translate(-50%, -50%);
    background:radial-gradient(closest-side, rgba(6,6,18,.62), rgba(6,6,18,.32) 55%, transparent 82%);
    opacity:0; transition:opacity 1s ease;
  }
  #verse-wrap.on::before{ opacity:1; }
  #numeral{
    margin:0 0 12px;
    font-size:clamp(.95rem, 3vw, 1.15rem);
    font-weight:700; letter-spacing:.5em;
    color:var(--gold);
    opacity:0; transition:opacity .8s ease;
    min-height:1.2em;
  }
  #verse-wrap.on #numeral{ opacity:.95; }
  #verse{
    margin:0;
    font-weight:600;
    font-size:clamp(2.2rem, 7.8vw, 4.5rem);
    line-height:1.12;
    color:var(--ivory);
    text-shadow:0 2px 3px rgba(0,0,0,.45), 0 8px 34px rgba(0,0,0,.6);
  }
  #verse .w{
    display:inline-block;
    opacity:0; transform:translateY(.4em) scale(.94); filter:blur(10px);
  }
  #verse-wrap.on #verse .w{
    animation:word 1s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:calc(var(--i) * 120ms);
  }
  #verse-wrap.off #verse .w{
    opacity:1; transform:none; filter:none;
    animation:wordOut .7s ease forwards;
    animation-delay:calc(var(--i) * 35ms);
  }
  @keyframes word{ to{ opacity:1; transform:none; filter:none; } }
  @keyframes wordOut{ to{ opacity:0; transform:translateY(-.3em); filter:blur(8px); } }
  #verse.title{
    font-size:clamp(2.6rem, 9.4vw, 5.6rem);
    font-weight:700;
    letter-spacing:.02em;
  }
  #verse.title .w{
    background:linear-gradient(180deg, #fff8e2 20%, #ecc97f 65%, #c48f3a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none;
  }

  #frame{
    position:absolute; inset:-30px -38px; z-index:-1;
    opacity:0; transition:opacity .6s ease; pointer-events:none;
  }
  #frame.on{ opacity:1; }
  #frame svg{ width:100%; height:100%; overflow:visible; }
  #frame rect{ stroke-dasharray:1000; stroke-dashoffset:1000; }
  #frame.on rect{ animation:draw 1.6s cubic-bezier(.4,.1,.2,1) forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* ---------- the letter ---------- */
  #shade{
    position:fixed; left:0; right:0; bottom:0; height:60%; z-index:11;
    background:linear-gradient(180deg, transparent, rgba(5,5,14,.55) 40%, rgba(5,5,14,.85));
    opacity:0; transition:opacity 3s ease; pointer-events:none;
  }
  #shade.on{ opacity:1; }
  #letter{
    position:fixed; left:50%; z-index:13;
    bottom:calc(9vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(720px, 90vw);
    text-align:center; pointer-events:none;
  }
  #letter p{
    margin:0 0 .4em;
    font-size:clamp(1.45rem, 5vw, 2.15rem);
    font-weight:600; line-height:1.3;
    color:var(--ivory);
    text-shadow:0 2px 3px rgba(0,0,0,.5), 0 8px 30px rgba(0,0,0,.75);
    opacity:0; transform:translateY(14px); filter:blur(6px);
    transition:opacity 2s ease, transform 2s cubic-bezier(.2,.8,.2,1), filter 2s ease;
  }
  #letter p.on{ opacity:1; transform:none; filter:none; }
  #letter p.sign{
    margin-top:1.1em;
    font-size:clamp(1rem, 3.4vw, 1.2rem);
    font-weight:700; letter-spacing:.3em; text-transform:uppercase;
    color:var(--gold);
  }

  #again{
    position:fixed; left:50%; z-index:14;
    bottom:calc(2.5vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font:inherit; font-size:.95rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
    color:rgba(255,248,236,.6); background:none; border:0; cursor:pointer;
    padding:10px 16px;
    opacity:0; pointer-events:none; transition:opacity 2s ease;
  }
  #again.on{ opacity:1; pointer-events:auto; }

  #sound{
    position:fixed; z-index:40;
    top:calc(14px + env(safe-area-inset-top)); right:14px;
    width:44px; height:44px; border-radius:50%;
    font:inherit; font-size:1.2rem; color:var(--ivory);
    background:rgba(8,8,20,.4); border:1px solid rgba(232,198,126,.35);
    cursor:pointer; opacity:.75;
  }
  #sound[hidden]{ display:none; }

  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (max-width:640px){
    #verse-wrap{ top:24%; }
    #gate{ bottom:16vh; }
  }
  @media (prefers-reduced-motion:reduce){
    #begin::before, #begin::after{ animation:none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="gate" aria-hidden="true">
  <div class="door l"></div>
  <div class="door r"></div>
</div>

<div id="verse-wrap">
  <div id="frame" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect x="1" y="1" width="98" height="98" rx="3" fill="none" stroke="#e8c67e" stroke-width="2" vector-effect="non-scaling-stroke" pathLength="1000"/>
      <rect x="4" y="5" width="92" height="90" rx="2" fill="none" stroke="#e8c67e" stroke-opacity=".5" stroke-width="1" vector-effect="non-scaling-stroke" pathLength="1000"/>
    </svg>
  </div>
  <p id="numeral"></p>
  <h2 id="verse"></h2>
</div>

<div id="shade"></div>
<div id="letter">
  <p>I couldn’t give you a ballroom from another century.</p>
  <p>So I made you a night of your own,</p>
  <p>and asked every flower in it to wait for you.</p>
  <p class="sign">Always at your service, ma’am.</p>
</div>
<button id="again" type="button">Begin again</button>

<section id="intro" aria-label="Start">
  <h1>Bonjour, ma’am.</h1>
  <button id="begin" type="button">Tap to begin</button>
  <p class="note">Turn your sound on.</p>
</section>

<button id="sound" type="button" aria-label="Mute music" hidden>♪</button>
<span class="sr" id="live" aria-live="polite"></span>

<script>
(() => {
  "use strict";

  const CONFIG = {
    // Optional licensed track, e.g. "music.mp3" placed next to this file.
    // Leave empty to use the original score generated below.
    musicSrc: ""
  };

  const VERSES = [
    "For her majesty,",
    "A voice sweeter than sugar,",
    "A heart warmer than the sun,",
    "A presence more royal than any crown,",
    "A smile prettier than any picture,",
    "A laugh more beautiful than any melody,",
    "Eyes brighter than daylight,",
    "And a spirit that refuses to be tamed."
  ];
  const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII"];

  const VERSE_AT = 6.5;
  const VERSE_LEN = 6.8;
  const GATHER_AT = VERSE_AT + VERSE_LEN * 8 + 0.6;
  const HIT_AT = GATHER_AT + 3.9;
  const STILL_AT = HIT_AT + 2.1;

  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const $ = (s) => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const pick = (a) => a[(Math.random() * a.length) | 0];

  /* ================================================================
     Canvas
     ================================================================ */
  const cv = $("#scene");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, U = 1;
  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = clamp(Math.min(W, H) / 760, 0.62, 1.35);
  }
  resize();
  addEventListener("resize", resize);
  const DENS = () => (REDUCED ? 0.5 : 1) * (W < 640 ? 0.65 : 1);

  /* ================================================================
     Flower sprites
     ================================================================ */
  const P = {
    roseCrimson: ["#5a0c1c", "#b0203c", "#ee6a80"],
    roseBlush:   ["#a2475a", "#ec9fab", "#ffdbe0"],
    roseIvory:   ["#b59c74", "#f1e4c8", "#fffbf2"],
    roseGold:    ["#8a5a1c", "#dca848", "#ffe6a6"],
    peonyPink:   ["#b0426a", "#f294b4", "#ffd8e6"],
    peonyCoral:  ["#b8504e", "#f6a08e", "#ffdccd"],
    peonyWhite:  ["#c9a7b0", "#f8e6ea", "#fffbfc"],
    sunflower:   ["#f7c02a", "#e0920f", "#6a3a14"],
    marigold:    ["#c4500c", "#f48e1e", "#ffc84e"],
    lilac:       ["#7b4fb0", "#a77ad6", "#dcc6f4"],
    lilacDeep:   ["#5a2f94", "#8a5cc8", "#c6a8ee"],
    iris:        ["#3a2280", "#6a48c2", "#ad92f4", "#f4c642"],
    tulipRed:    ["#8f1426", "#de3a50", "#ff96a2"],
    tulipPink:   ["#b54a7a", "#f394c0", "#ffd6ea"],
    tulipGold:   ["#c98a12", "#f6c83e", "#fff2ae"],
    lily:        ["#d86f94", "#fbd2df", "#fff8fb"],
    lilyWhite:   ["#d2c2ac", "#fbf5ec", "#ffffff"],
    jasmine:     ["#e6dfcc", "#ffffff", "#f2e186"],
    poppy:       ["#6d0b12", "#de2330", "#ff6a52"],
    daisy:       ["#ffffff", "#efebe0", "#f4c430"],
    cornflower:  ["#1d3a9a", "#4470e6", "#a4beff"],
    wildrose:    ["#c2577a", "#f4a6c0", "#fff0f5"]
  };

  function grad(g, x0, y0, x1, y1, c0, c1){
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr;
  }
  function petal(g, ang, len, wid, c0, c1){
    g.save(); g.rotate(ang);
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(len * 0.25, wid, len * 0.95, wid * 0.95, len, 0);
    g.bezierCurveTo(len * 0.95, -wid * 0.95, len * 0.25, -wid, 0, 0);
    g.fillStyle = grad(g, 0, 0, len, 0, c0, c1); g.fill();
    g.restore();
  }
  function pointed(g, ang, len, wid, c0, c1){
    g.save(); g.rotate(ang);
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(len * 0.5, wid, len, 0);
    g.quadraticCurveTo(len * 0.5, -wid, 0, 0);
    g.fillStyle = grad(g, 0, 0, len, 0, c0, c1); g.fill();
    g.restore();
  }
  function ring(g, R, n, d, rx, ry, c0, c1, off){
    for (let i = 0; i < n; i++){
      const a = off + i * TAU / n;
      g.save(); g.rotate(a);
      const gr = g.createRadialGradient(R * d * 0.3, 0, 0, R * d, 0, R * Math.max(rx, ry) * 1.2);
      gr.addColorStop(0, c0); gr.addColorStop(1, c1);
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(R * d, 0, R * rx, R * ry, 0, 0, TAU); g.fill();
      g.strokeStyle = "rgba(40,0,10,.14)"; g.lineWidth = R * 0.012; g.stroke();
      g.restore();
    }
  }
  function dots(g, R, n, r0, size, col){
    g.fillStyle = col;
    for (let i = 0; i < n; i++){
      const a = i * 2.39996, rr = R * r0 * Math.sqrt(i / n);
      g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * size, 0, TAU); g.fill();
    }
  }

  const DRAW = {
    rose(g, R, p){
      ring(g, R, 5, 0.5, 0.52, 0.46, p[1], p[0], 0.25);
      ring(g, R, 5, 0.32, 0.4, 0.34, p[2], p[1], 0.9);
      ring(g, R, 4, 0.16, 0.27, 0.23, p[2], p[1], 1.7);
      g.strokeStyle = p[0]; g.lineWidth = R * 0.045; g.lineCap = "round";
      for (let k = 0; k < 3; k++){
        g.beginPath(); g.arc(0, 0, R * (0.05 + k * 0.055), k * 1.3, k * 1.3 + Math.PI * 1.25); g.stroke();
      }
    },
    peony(g, R, p){
      ring(g, R, 12, 0.56, 0.3, 0.25, p[1], p[0], 0);
      ring(g, R, 11, 0.42, 0.27, 0.22, p[2], p[1], 0.3);
      ring(g, R, 9, 0.27, 0.22, 0.18, p[2], p[1], 0.7);
      ring(g, R, 7, 0.13, 0.16, 0.13, p[2], p[2], 1.1);
      dots(g, R, 10, 0.08, 0.025, "#f4c84a");
    },
    sunflower(g, R, p){
      for (let i = 0; i < 22; i++) pointed(g, i * TAU / 22, R, R * 0.16, p[1], p[0]);
      for (let i = 0; i < 22; i++) pointed(g, (i + 0.5) * TAU / 22, R * 0.88, R * 0.15, p[0], p[1]);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.4);
      gr.addColorStop(0, "#3a1c08"); gr.addColorStop(1, p[2]);
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R * 0.4, 0, TAU); g.fill();
      dots(g, R, 70, 0.36, 0.018, "rgba(255,210,120,.35)");
    },
    marigold(g, R, p){
      ring(g, R, 16, 0.5, 0.3, 0.2, p[1], p[0], 0);
      ring(g, R, 14, 0.36, 0.26, 0.18, p[2], p[1], 0.2);
      ring(g, R, 10, 0.22, 0.2, 0.15, p[2], p[1], 0.5);
      ring(g, R, 6, 0.1, 0.13, 0.1, p[2], p[1], 0.9);
    },
    lilac(g, R, p){
      let s = 7;
      const rng = () => (s = (s * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 52; i++){
        const t = i / 52;
        const y = -R * 0.95 + t * R * 1.8;
        const w = R * 0.62 * (0.22 + 0.78 * t);
        const x = (rng() * 2 - 1) * w;
        const c = p[(rng() * 3) | 0];
        g.fillStyle = c;
        for (let k = 0; k < 4; k++){
          const a = k * TAU / 4 + rng();
          g.beginPath(); g.arc(x + Math.cos(a) * R * 0.07, y + Math.sin(a) * R * 0.07, R * 0.075, 0, TAU); g.fill();
        }
        g.fillStyle = "rgba(255,255,255,.75)";
        g.beginPath(); g.arc(x, y, R * 0.025, 0, TAU); g.fill();
      }
    },
    iris(g, R, p){
      for (let k = 0; k < 3; k++) petal(g, -Math.PI / 2 + k * TAU / 3 + Math.PI / 3, R * 0.98, R * 0.44, p[1], p[0]);
      for (let k = 0; k < 3; k++) petal(g, -Math.PI / 2 + k * TAU / 3, R * 0.82, R * 0.36, p[2], p[1]);
      g.strokeStyle = p[3]; g.lineWidth = R * 0.07; g.lineCap = "round";
      for (let k = 0; k < 3; k++){
        const a = -Math.PI / 2 + k * TAU / 3 + Math.PI / 3;
        g.beginPath(); g.moveTo(Math.cos(a) * R * 0.1, Math.sin(a) * R * 0.1);
        g.lineTo(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5); g.stroke();
      }
    },
    tulip(g, R, p){
      g.translate(0, R * 0.15);
      g.beginPath();
      g.moveTo(-R * 0.44, 0);
      g.bezierCurveTo(-R * 0.52, -R * 0.72, -R * 0.12, -R * 0.88, 0, -R * 0.74);
      g.bezierCurveTo(R * 0.12, -R * 0.88, R * 0.52, -R * 0.72, R * 0.44, 0);
      g.bezierCurveTo(R * 0.36, R * 0.48, -R * 0.36, R * 0.48, -R * 0.44, 0);
      g.fillStyle = grad(g, 0, -R * 0.8, 0, R * 0.4, p[1], p[0]); g.fill();
      [-1, 1].forEach((sd) => {

      const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const o2 = ac.createOscillator(); o2.type = "triangle"; o2.frequency.value = f;
      const e = env(t, 0.01, g, 0.05, 0.7);
      o.connect(e); o2.connect(e); route(e, 0.15);
      o.start(t); o2.start(t); o.stop(t + 0.9); o2.stop(t + 0.9);
    }
    function harp(t, f, g){
      const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const e = env(t, 0.005, g, 0, 1.4);
      o.connect(e); route(e, 0.7);
      o.start(t); o.stop(t + 1.5);
    }
    function bell(t, f, g){
      [[1, 1], [2.76, 0.4], [5.4, 0.15]].forEach(([m, a]) => {
        const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f * m;
        const e = env(t, 0.004, g * a, 0, 2.2);
        o.connect(e); route(e, 0.8);
        o.start(t); o.stop(t + 2.3);
      });
    }
    function timp(t, g){
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(96, t); o.frequency.exponentialRampToValueAtTime(56, t + 0.6);
      const e = env(t, 0.008, g, 0.05, 1.3);
      o.connect(e); route(e, 0.5);
      o.start(t); o.stop(t + 1.5);
      const n = ac.createBufferSource(); n.buffer = noise;
      const fl = ac.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = 420;
      const e2 = env(t, 0.004, g * 0.5, 0, 0.18);
      n.connect(fl); fl.connect(e2); route(e2, 0.3);
      n.start(t); n.stop(t + 0.25);
    }
    function swell(t, dur, g){
      const n = ac.createBufferSource(); n.buffer = noise; n.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = "bandpass"; fl.Q.value = 0.8;
      fl.frequency.setValueAtTime(500, t); fl.frequency.exponentialRampToValueAtTime(7000, t + dur);
      const e = ac.createGain();
      e.gain.setValueAtTime(0.0001, t);
      e.gain.exponentialRampToValueAtTime(g, t + dur);
      e.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
      n.connect(fl); fl.connect(e); route(e, 0.6);
      n.start(t); n.stop(t + dur + 0.4);
    }
    function whoosh(t, dur, g){
      const n = ac.createBufferSource(); n.buffer = noise; n.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = "lowpass";
      fl.frequency.setValueAtTime(220, t);
      fl.frequency.exponentialRampToValueAtTime(3200, t + dur * 0.55);
      fl.frequency.exponentialRampToValueAtTime(260, t + dur);
      const e = ac.createGain();
      e.gain.setValueAtTime(0.0001, t);
      e.gain.exponentialRampToValueAtTime(g, t + dur * 0.5);
      e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      n.connect(fl); fl.connect(e); route(e, 0.5);
      n.start(t); n.stop(t + dur + 0.1);
    }

    function scheduleBeat(n, t){
      const bar = Math.floor(n / 3), b = n % 3, li = bar % 16;
      const ch = CH[PROG[li]];
      const lvl = Math.min(8, Math.floor(bar / 5));
      if (b === 0){
        bass(t, ch.bass, 0.3 + lvl * 0.01);
        pad(t, ch.pad, BAR * 0.98, 0.045 + 0.005 * lvl, 900 + lvl * 220);
        let o = 0;
        MEL[li].forEach(([f, beats]) => {
          const nt = t + o * BEAT, d = beats * BEAT * 0.95;
          violin(nt, f, d, 0.07 + 0.004 * lvl);
          if (lvl >= 3) violin(nt, f / 2, d, 0.04);
          if (lvl >= 6) bell(nt, f * 2, 0.02 + 0.003 * (lvl - 6));
          o += beats;
        });
        if (bar % 4 === 0 && lvl >= 1) timp(t, 0.16 + 0.025 * lvl);
      } else {
        ch.stab.forEach((f) => pluck(t, f, 0.05 + 0.005 * lvl, 0.32));
      }
      if (lvl >= 4){
        harp(t + BEAT * 0.5, ch.arp[(n * 2 + 1) % ch.arp.length], 0.035);
      }
      if (lvl >= 7){
        harp(t, ch.arp[(n * 2) % ch.arp.length] * 2, 0.03);
      }
    }
    function tick(){
      if (!ac || ac.state !== "running") return;
      const now = ac.currentTime;
      while (nextBeat < now + 0.3 && nextBeat < waltzEnd){
        scheduleBeat(beatN, nextBeat);
        beatN++; nextBeat += BEAT;
      }
    }

    function arp(from, to, chord, step, g){
      let i = 0;
      for (let t = from; t < to; t += step, i++){
        const notes = chord.arp;
        harp(t, notes[i % notes.length] * (i % 8 < 4 ? 1 : 0.5), g);
      }
    }

    function score(){
      t0 = ac.currentTime + 0.05;
      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(0.85, t0 + 0.5);

      [F.D6, F.A5, F.Fs5, F.D5, F.A4].forEach((f, i) => bell(t0 + i * 0.08, f, 0.07));
      timp(t0, 0.28);
      pad(t0, CH.D.pad, 2.8, 0.05, 700);
      arp(t0 + 0.3, t0 + 2.8, CH.D, 0.16, 0.05);
      pad(t0 + 2.8, CH.G.pad, 1.8, 0.055, 900);
      arp(t0 + 2.8, t0 + 4.6, CH.G, 0.14, 0.05);
      pad(t0 + 4.6, CH.A.pad, 1.9, 0.06, 1100);
      arp(t0 + 4.6, t0 + 6.45, CH.A, 0.11, 0.055);
      whoosh(t0 + 3.2, 1.4, 0.22);
      bell(t0 + 3.9, F.A5, 0.07); bell(t0 + 3.95, F.E5, 0.05);
      timp(t0 + 3.9, 0.22);
      swell(t0 + 5.0, 1.45, 0.16);

      waltzStart = t0 + VERSE_AT;
      waltzEnd = t0 + HIT_AT - 0.05;
      nextBeat = waltzStart; beatN = 0;

      swell(t0 + GATHER_AT, HIT_AT - GATHER_AT, 0.22);
      const gliss = [F.D4, F.Fs4, F.A4, F.D5, F.Fs5, F.A5, F.D6];
      for (let i = 0; i < 28; i++){
        harp(t0 + GATHER_AT + i * ((HIT_AT - GATHER_AT) / 28), gliss[i % gliss.length] * (i >= 14 ? 2 : 1), 0.04);
      }

      const h = t0 + HIT_AT;
      timp(h, 0.4); timp(h + 0.02, 0.2);
      bass(h, F.D2, 0.38);
      pad(h, [F.D2, F.D3, F.A3, F.D4, F.Fs4, F.A4, F.D5], 6, 0.06, 1800);
      violin(h, F.D6, 3.4, 0.06); violin(h, F.A5, 3.4, 0.045); violin(h, F.Fs5, 3.4, 0.04);
      [F.D6 * 2, F.A5 * 2, F.Fs5 * 2, F.D6, F.A5, F.Fs5, F.D5, F.A4].forEach((f, i) => bell(h + 0.1 + i * 0.11, f, 0.05));

      const s = t0 + STILL_AT;
      pad(s, CH.D.pad, 8, 0.035, 650);
      pad(s + 8, CH.G.pad, 8, 0.03, 600);
      pad(s + 16, CH.D.pad, 11, 0.028, 550);
      let k = 0;
      for (let t = s + 0.6; t < s + 28; t += 0.62, k++){
        const c = t < s + 8 ? CH.D : t < s + 16 ? CH.G : CH.D;
        harp(t, c.arp[k % 4], 0.034 * (1 - (t - s) / 34));
      }
      bell(s + 13.5, F.D6, 0.04);
    }

    return {
      start(){
        if (CONFIG.musicSrc){
          track = new Audio(CONFIG.musicSrc);
          track.volume = 0;
          track.play().catch(() => {});
          let v = 0;
          const id = setInterval(() => { v = Math.min(0.9, v + 0.05); track.volume = v; if (v >= 0.9) clearInterval(id); }, 120);
          return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 3.5;
        comp.attack.value = 0.005; comp.release.value = 0.25;
        out = ac.createGain(); out.gain.value = 0.0001;
        out.connect(comp); comp.connect(ac.destination);
        dry = ac.createGain(); dry.gain.value = 0.9; dry.connect(out);
        const conv = ac.createConvolver(); conv.buffer = impulse(3.2, 2.4);
        wet = ac.createGain(); wet.gain.value = 0.5;
        wet.connect(conv); conv.connect(out);
        noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        ac.resume();
        score();
        timer = setInterval(tick, 40);
        tick();
      },
      soften(){
        if (track){
          const id = setInterval(() => { track.volume = Math.max(0.3, track.volume - 0.03); if (track.volume <= 0.3) clearInterval(id); }, 150);
        }
      },
      pause(){ if (ac) ac.suspend(); if (track) track.pause(); },
      resume(){ if (ac && !muted) ac.resume(); if (track && !muted) track.play().catch(() => {}); },
      toggle(){
        muted = !muted;
        if (ac) muted ? ac.suspend() : ac.resume();
        if (track) track.muted = muted;
        return !muted;
      }
    };
  })();

  function ease(dt){
    for (const k in val){
      const o = val[k];
      o.v += (o.t - o.v) * (1 - Math.exp(-dt * o.r));
    }
    const kk = 1 - Math.exp(-dt * 0.9);

      sky.top[i] += (sky.tTop[i] - sky.top[i]) * kk;
      sky.bot[i] += (sky.tBot[i] - sky.bot[i]) * kk;

  function update(dt){
    for (const s of streams){
      if (T > s.until) continue;
      s.acc += dt * s.rate * DENS();
      while (s.acc >= 1){ s.acc -= 1; s.fn(); }
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      if (p.delay > 0){ p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.vx += (WIND + GUST) * 26 * dt * (p.k === "petal" ? 1 : 0.3);
      const dr = Math.exp(-dt * (p.drag ?? 0));
      p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt;
      p.y += p.vy * dt + (p.wave ? Math.cos(T * 4 + p.wave.ph) * p.wave.amp * dt : 0);
      if (p.k === "petal"){ p.rot += p.vr * dt; p.fl += p.flv * dt; if (p.grow) p.size *= Math.exp(p.grow * dt); }
      if (p.x < -120 || p.x > W + 120 || p.y > H + 120 || p.y < -200) parts.splice(i, 1);
    }
    for (const f of fireflies){
      f.ph += dt * 2;
      f.x += (f.vx + Math.sin(f.ph * 0.7) * 0.01) * dt;
      f.y += (f.vy + Math.cos(f.ph * 0.5) * 0.008) * dt;
      if (f.x < 0) f.x = 1; if (f.x > 1) f.x = 0;
      if (f.y < 0.35) f.y = 0.95; if (f.y > 0.98) f.y = 0.4;
    }
    let burst = false;
    for (const f of flowers){
      if (f.liftAt && T >= f.liftAt && (f.mode === "field" || f.mode === "float")){
        const p = pose(f);
        if (f.burst){
          petalBurst(p.x, p.y, 7, f.pal, 0.7);
          f.mode = "gone"; burst = true;
          continue;
        }
        f.sx = p.x / W; f.sy = p.y / H; f.ss = Math.max(p.s, 1) / U; f.srot = p.rot;
        f.mode = "fly"; f.fStart = T;
        sparkleBurst(p.x, p.y, 4, "gold");
      }
    }
    if (burst){
      for (let i = flowers.length - 1; i >= 0; i--) if (flowers[i].mode === "gone") flowers.splice(i, 1);
      sortDirty = true;
    }
  }

  function pose(f){
    const age = T - f.born;
    if (f.mode === "field"){
      const bx = f.fx * W, by = f.fy * H;
      const grow = easeOutCubic(clamp(age / 0.7, 0, 1));
      const bl = age < 0.3 ? 0 : easeOutBack(clamp((age - 0.3) / 0.75, 0, 1));
      const sw = Math.sin(T * 1.6 * f.sway + f.ph) * 0.07 * (0.5 + WIND) + GUST * 0.15 * Math.sin(T * 2.6 + f.fx * 7);
      const bo = f.bounce ? 1 + 0.1 * Math.pow(Math.max(0, Math.cos(age * TAU / (VERSE_LEN / 5))), 6) : 1;
      const L = f.stem * U * grow;
      return { bx, by, L, sw, grow, x: bx + Math.sin(sw) * L, y: by - Math.cos(sw) * L, s: f.size * U * bl * bo, rot: sw * 0.9, bl };
    }
    if (f.mode === "float"){
      const bl = easeOutBack(clamp(age / 0.85, 0, 1));
      return { x: f.fx * W + Math.sin(T * 0.9 + f.ph) * 4 * U, y: f.fy * H + Math.cos(T * 1.1 + f.ph) * 5 * U, s: f.size * U * bl, rot: Math.sin(T * 0.7 + f.ph) * 0.18, bl };
    }
    const B = BQ();
    const br = STILL ? 1 + 0.014 * Math.sin(T * 1.3) : 1;
    const tx = B.cx + f.tx * B.R * br, ty = B.cy + f.ty * B.R * br, ts = f.ts * B.R * br;
    if (f.mode === "bq") return { x: tx, y: ty, s: ts, rot: f.trot, bl: 1 };
    const k = clamp((T - f.fStart) / f.fDur, 0, 1), e = easeInOut(k);
    const sx = f.sx * W, sy = f.sy * H;
    const mx = (sx + tx) / 2 + f.side * W * 0.14, my = Math.min(sy, ty) - H * 0.2;
    const u = 1 - e;
    const x = u * u * sx + 2 * u * e * mx + e * e * tx;
    const y = u * u * sy + 2 * u * e * my + e * e * ty;
    if (k >= 1){
      f.mode = "bq"; landed++;
      sparkleBurst(tx, ty, 5, "gold");
      val.paper.t = Math.max(val.paper.t, landed / Math.max(toLand, 1));
    }
    return { x, y, s: lerp(f.ss * U, ts, e), rot: lerp(f.srot, f.trot, e) + Math.sin(k * Math.PI) * f.spin, bl: 1 };
  }

  function glow(name, x, y, size, a){
    ctx.globalAlpha = a;
    ctx.drawImage(GLOW[name], x - size / 2, y - size / 2, size, size);
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgb(${sky.top.map(Math.round)})`);
    g.addColorStop(1, `rgb(${sky.bot.map(Math.round)})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (running && T < WARP_LEN){
      const k = T / WARP_LEN;
      const v = Math.pow(Math.sin(Math.PI * k), 1.4) * 2.4;
      const m = Math.min(W, H) * 0.5;
      ctx.lineCap = "round";
      for (const s of warp){
        const z0 = s.z;
        s.z -= v * (1 / 60);
        if (s.z < 0.04){ s.z = 1; s.x = rand(-1, 1); s.y = rand(-1, 1); continue; }
        const x1 = W / 2 + (s.x / z0) * m, y1 = H / 2 + (s.y / z0) * m;
        const x2 = W / 2 + (s.x / s.z) * m, y2 = H / 2 + (s.y / s.z) * m;
        const a = clamp((1 - s.z) * 1.2, 0, 1) * (1 - k * 0.3);
        ctx.strokeStyle = `rgba(255,240,215,${a})`;
        ctx.lineWidth = clamp((1 - s.z) * 2.6, 0.4, 2.6);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }

    const sa = val.stars.v;
    if (sa > 0.02){
      for (const s of stars){
        const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(T * s.s + s.ph + performance.now() / 1600))) * sa;
        ctx.fillStyle = `rgba(255,248,236,${a})`;
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
      }
    }

    const mv = val.moon.v;
    if (mv > 0.01){
      const r = 40 * U;
      const mx = W * (W < 640 ? 0.8 : 0.82), my = H * (0.13 + 0.16 * (1 - mv));
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      glow("white", mx, my, r * 9, 0.35 * mv);
      ctx.restore();
      ctx.globalAlpha = mv;
      const mg = ctx.createRadialGradient(mx - r * 0.3, my - r * 0.3, r * 0.1, mx, my, r);
      mg.addColorStop(0, "#fffaea"); mg.addColorStop(0.7, "#efe1bb"); mg.addColorStop(1, "#d6c493");
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(170,150,110,.25)";
      ctx.beginPath(); ctx.arc(mx + r * 0.25, my - r * 0.15, r * 0.2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(mx - r * 0.2, my + r * 0.3, r * 0.13, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    const ra = val.rays.v;
    if (ra > 0.01){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const ox = W / 2, oy = -H * 0.18, len = H * 1.4;
      for (let i = 0; i < 9; i++){
        const a = Math.PI / 2 + (i - 4) * 0.15 + Math.sin(T * 0.3 + i) * 0.05;
        const w = 0.035 + 0.02 * Math.sin(T * 0.8 + i * 2);
        const g2 = ctx.createLinearGradient(ox, oy, ox + Math.cos(a) * len, oy + Math.sin(a) * len);
        g2.addColorStop(0, `rgba(255,228,175,${0.2 * ra})`);
        g2.addColorStop(1, "rgba(255,228,175,0)");
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox + Math.cos(a - w) * len, oy + Math.sin(a - w) * len);
        ctx.lineTo(ox + Math.cos(a + w) * len, oy + Math.sin(a + w) * len);
        ctx.fill();
      }
      ctx.restore();
    }

    const su = val.sun.v;
    if (su > 0.01){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      glow("warm", W / 2, H * (0.7 - 0.08 * su), Math.max(W, H) * 1.1, 0.55 * su);
      ctx.restore();
    }
  }

  function drawGround(){
    const ga = val.ground.v;
    if (ga < 0.01) return;
    ctx.globalAlpha = ga;
    ctx.fillStyle = "#0a1520";
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H * 0.6);
    for (let i = 0; i <= 30; i++){
      const x = (i / 30) * W;
      ctx.lineTo(x, H * 0.6 - Math.abs(Math.sin(i * 0.9)) * H * 0.04 - Math.sin(i * 0.31) * H * 0.02);
    }
    ctx.lineTo(W, H); ctx.fill();
    const g = ctx.createLinearGradient(0, H * 0.62, 0, H);
    g.addColorStop(0, "#13261c"); g.addColorStop(1, "#060c09");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H * 0.67);
    ctx.quadraticCurveTo(W * 0.5, H * 0.6, W, H * 0.67); ctx.lineTo(W, H); ctx.fill();
    const m = ctx.createLinearGradient(0, H * 0.56, 0, H * 0.72);
    m.addColorStop(0, "rgba(220,225,245,0)"); m.addColorStop(0.5, "rgba(220,225,245,.07)"); m.addColorStop(1, "rgba(220,225,245,0)");
    ctx.fillStyle = m; ctx.fillRect(0, H * 0.56, W, H * 0.16);
    ctx.globalAlpha = 1;

    const sp = val.spot.v;
    if (sp > 0.01){
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      glow("warm", W / 2, H * 0.86, 420 * U, 0.4 * sp);
      ctx.restore();
    }
  }

  function drawStemAndHead(f, p){
    if (f.mode === "field" && p.L > 1){
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#2c5a34";
      ctx.lineWidth = Math.max(1.3, 2.6 * U * (0.4 + f.fy * 0.6));
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(p.bx, p.by);
      ctx.quadraticCurveTo(p.bx, p.by - p.L * 0.5, p.x, p.y); ctx.stroke();
      if (p.grow > 0.5){
        ctx.fillStyle = "#3b6e3e";
        ctx.save();
        ctx.translate(p.bx + (p.x - p.bx) * 0.3, p.by - p.L * 0.35);
        ctx.rotate(-0.7 + p.sw);
        ctx.beginPath(); ctx.ellipse(8 * U, 0, 10 * U, 3.6 * U, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
    if (p.s < 1) return;
    if (!f.popped && p.bl > 0.35){
      f.popped = true;
      sparkleBurst(p.x, p.y, 5, f.glow ? "white" : "gold");
      if (f.mode !== "fly") for (let i = 0; i < 3; i++) petalP(p.x, p.y, rand(-60, 60) * U, rand(-90, -30) * U, f.pal[2], rand(3, 6) * U, { life: rand(1.5, 2.5), g: 60, drag: 0.8 });
    }
    if (f.glow){
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      glow("white", p.x, p.y, p.s * 2.2, 0.38 + 0.12 * Math.sin(T * 3 + f.ph));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.drawImage(f.spr, -p.s / 2, -p.s / 2, p.s, p.s);
    ctx.restore();
  }

  function drawPaper(front){
    const a = front ? val.paper.v : val.paper.v * 0.95;
    if (a < 0.01) return;
    const { cx, cy, R } = BQ();
    const br = STILL ? 1 + 0.014 * Math.sin(T * 1.3) : 1;
    const r = R * br;
    ctx.globalAlpha = a;
    if (!front){
      ctx.fillStyle = grad(ctx, 0, cy - r * 0.6, 0, cy + r * 1.9, "#efe2c6", "#b49a6c");
      ctx.beginPath();
      ctx.moveTo(cx - r * 1.32, cy + r * 0.05);
      ctx.quadraticCurveTo(cx, cy - r * 0.6, cx + r * 1.32, cy + r * 0.05);
      ctx.lineTo(cx + r * 0.2, cy + r * 1.9); ctx.lineTo(cx - r * 0.2, cy + r * 1.9);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    ctx.fillStyle = grad(ctx, cx - r, 0, cx + r, 0, "#e9dab8", "#fbf2df");
    ctx.beginPath();
    ctx.moveTo(cx - r * 1.08, cy + r * 0.5);
    ctx.quadraticCurveTo(cx, cy + r * 0.92, cx + r * 1.08, cy + r * 0.5);
    ctx.lineTo(cx + r * 0.17, cy + r * 1.95); ctx.lineTo(cx - r * 0.17, cy + r * 1.95);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#d7b469"; ctx.lineWidth = 2 * U;
    ctx.beginPath();
    ctx.moveTo(cx - r * 1.08, cy + r * 0.5);
    ctx.quadraticCurveTo(cx, cy + r * 0.92, cx + r * 1.08, cy + r * 0.5); ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,100,.35)"; ctx.lineWidth = 1;
    for (let k = -2; k <= 2; k++){
      ctx.beginPath(); ctx.moveTo(cx + k * r * 0.3, cy + r * 0.7); ctx.lineTo(cx + k * r * 0.04, cy + r * 1.9); ctx.stroke();
    }

    const ra = val.ribbon.v;
    if (ra > 0.01){
      ctx.globalAlpha = ra;
      const ty = cy + r * 1.14;
      const rg = grad(ctx, cx - r * 0.5, ty - r * 0.2, cx + r * 0.5, ty + r * 0.2, "#8e1630", "#d23a55");
      ctx.fillStyle = rg;
      [-1, 1].forEach((sd) => {
        ctx.save(); ctx.translate(cx + sd * r * 0.22, ty - r * 0.02); ctx.rotate(sd * 0.45);
        ctx.beginPath(); ctx.ellipse(0, 0, r * 0.25 * ra, r * 0.12, 0, 0, TAU); ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.moveTo(cx, ty);
        ctx.quadraticCurveTo(cx + sd * r * 0.16, ty + r * 0.3, cx + sd * r * 0.24, ty + r * 0.55 * ra);
        ctx.lineTo(cx + sd * r * 0.14, ty + r * 0.5 * ra);
        ctx.quadraticCurveTo(cx + sd * r * 0.08, ty + r * 0.25, cx, ty);
        ctx.fill();
      });
      ctx.fillStyle = "#e8c67e";
      ctx.beginPath(); ctx.arc(cx, ty, r * 0.075, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawParts(){
    for (const p of parts){
      if (p.delay > 0) continue;
      const fade = clamp(p.life / Math.min(1.2, p.max * 0.4), 0, 1) * clamp((p.max - p.life) / 0.25, 0, 1);
      if (p.k === "petal"){
        ctx.globalAlpha = fade * 0.95;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.scale(1, 0.3 + 0.7 * Math.abs(Math.cos(p.fl)));
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.62, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts){
      if (p.k !== "spark" || p.delay > 0) continue;
      let a = clamp(p.life / p.max, 0, 1);
      if (p.twinkle) a *= 0.5 + 0.5 * Math.sin(T * 9 + p.x * 0.05);
      glow(p.tint, p.x, p.y, p.size, a);
    }
    if (val.ground.v > 0.1){
      for (const f of fireflies){
        const a = (0.35 + 0.65 * Math.max(0, Math.sin(f.ph * 1.6))) * val.ground.v;
        glow("gold", f.x * W, f.y * H, 16 * U, a);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function render(){
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    drawSky();

    const cam = val.cam.v;
    ctx.save();
    ctx.translate(W / 2, H * 0.45); ctx.scale(cam, cam); ctx.translate(-W / 2, -H * 0.45);

    drawGround();

    if (sortDirty){
      fieldSorted = flowers.slice().sort((a, b) => (a.mode === "float") - (b.mode === "float") || a.fy - b.fy);
      sortDirty = false;
    }
    for (const f of fieldSorted){
      if (T < f.born) continue;
      if (f.mode !== "field" && f.mode !== "float") continue;
      drawStemAndHead(f, pose(f));
    }

    drawPaper(false);
    for (const f of bqOrder) if (f.mode === "bq") drawStemAndHead(f, pose(f));
    drawPaper(true);
    for (const f of flowers) if (f.mode === "fly") drawStemAndHead(f, pose(f));

    drawParts();
    ctx.restore();

    if (FLASH > 0.005){
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = `rgba(255,240,220,${FLASH})`;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
    }
  }

  let ambientAcc = 0;
  function ambient(dt){
    if (running) return;
    ambientAcc += dt * 14;
    while (ambientAcc >= 1){
      ambientAcc -= 1;
      spark(rand(0, W), rand(H * 0.3, H), rand(-8, 8), -rand(10, 28) * U, Math.random() < 0.7 ? "gold" : "pink", rand(6, 14) * U, rand(3, 6), { twinkle: true });
    }
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running){
      T += dt;
      while (cueIdx < cues.length && cues[cueIdx].t <= T) cues[cueIdx++].fn();
    }
    ambient(dt);
    ease(dt);
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================================================================
     The tap
     ================================================================ */
  const intro = $("#intro");
  const soundBtn = $("#sound");
  function begin(){
    if (running) return;
    Music.start();
    running = true;
    const m = location.hash.match(/t=(\d+(\.\d+)?)/);
    if (m) T = parseFloat(m[1]);
    intro.classList.add("gone");
    setTimeout(() => { intro.style.display = "none"; }, 1600);
    soundBtn.hidden = false;
    try {
      if (matchMedia("(hover: none)").matches && document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      }
    } catch (_) {}
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (_) {}
  }
  intro.addEventListener("click", begin);
  addEventListener("keydown", (e) => {
    if (!running && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); begin(); }
  });
  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const on = Music.toggle();
    soundBtn.textContent = on ? "♪" : "×";
    soundBtn.setAttribute("aria-label", on ? "Mute music" : "Play music");
  });
  $("#again").addEventListener("click", () => location.reload());
  document.addEventListener("visibilitychange", () => {
    if (!running) return;
    if (document.hidden) Music.pause(); else { Music.resume(); last = performance.now(); }
  });
})();
</script>
</body>
</html>
