<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title></title>
<meta name="description" content="" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#05070d;
    --night:#0b1220;
    --deep:#152038;
    --ivory:#f3ead6;
    --ivory-dim:rgba(243,234,214,.72);
    --gold:#c9a56a;
    --gold-soft:rgba(201,165,106,.55);
    --rose:#c45c6a;
    --blush:#e7b7b4;
    --sage:#7d9a7a;
    --display:"Cormorant Garamond",Palatino,"Palatino Linotype","Iowan Old Style",Georgia,serif;
    --script:"Great Vibes","Snell Roundhand","Segoe Script",cursive;
    --ease:cubic-bezier(.22,.7,.2,1);
    --slow:cubic-bezier(.19,1,.22,1);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    background:var(--void);
    color:var(--ivory);
    overflow:hidden;
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  button{ font:inherit; color:inherit; }

  #world{
    position:fixed; inset:0;
    cursor:none;
  }
  @media (hover:none){
    #world{ cursor:auto; }
  }

  .vignette{
    position:absolute; inset:0; z-index:28; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.35), transparent 18%, transparent 78%, rgba(0,0,0,.55));
  }
  .grain{
    position:absolute; inset:0; z-index:29; pointer-events:none; opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
    mix-blend-mode:overlay;
  }

  #sky, #fx{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    pointer-events:none;
  }
  #sky{ z-index:1; }
  #fx{ z-index:30; }
  #hit{
    position:absolute; inset:0; z-index:43;
    cursor:none;
  }

  .sky-wash{
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(80% 60% at 70% 12%, rgba(90,110,170,.28), transparent 55%),
      radial-gradient(90% 70% at 20% 90%, rgba(80,30,50,.22), transparent 50%),
      linear-gradient(180deg, #070b16 0%, #10182a 48%, #1a1630 100%);
    opacity:0;
    transition:opacity 2.8s var(--slow), filter 3s var(--slow);
    filter:saturate(.6) brightness(.35);
  }
  .is-gate .sky-wash,
  .is-enter .sky-wash{ opacity:1; filter:saturate(.7) brightness(.45); }
  .is-candle .sky-wash{ opacity:1; filter:saturate(.5) brightness(.25); }
  .is-garden .sky-wash,
  .is-gather .sky-wash,
  .is-still .sky-wash{
    opacity:1;
    filter:saturate(1) brightness(.85);
    background:
      radial-gradient(70% 50% at 74% 8%, rgba(190,205,255,.35), transparent 50%),
      radial-gradient(90% 70% at 50% 100%, rgba(70,40,70,.4), transparent 55%),
      linear-gradient(180deg, #071018 0%, #152444 42%, #2a2144 100%);
  }
  .is-gather .sky-wash,
  .is-still .sky-wash{
    background:
      radial-gradient(60% 45% at 50% 18%, rgba(255,220,170,.18), transparent 55%),
      radial-gradient(90% 70% at 50% 100%, rgba(90,40,60,.45), transparent 55%),
      linear-gradient(180deg, #080c16 0%, #1a2240 45%, #3a2744 100%);
  }

  .moon{
    position:absolute; z-index:2; pointer-events:none;
    top:8%; right:12%;
    width:min(22vw, 160px); aspect-ratio:1;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 32%, #fff7e4, #e6d7b0 42%, #cfc09a 70%, #b7a57c);
    box-shadow:
      0 0 40px 12px rgba(255,236,200,.28),
      0 0 120px 40px rgba(200,210,255,.12);
    opacity:0; transform:translate3d(20px, 30px, 0) scale(.6);
    transition:opacity 3s var(--slow), transform 4s var(--slow), width 3s var(--slow);
  }
  .moon::after{
    content:""; position:absolute; inset:18% 22% auto auto; width:22%; height:16%;
    border-radius:50%; background:rgba(160,140,110,.18);
  }
  .is-gate .moon{ opacity:.55; transform:none; }
  .is-garden .moon,
  .is-gather .moon,
  .is-still .moon{
    opacity:.95; width:min(28vw, 210px); top:6%; right:10%;
    transform:translate3d(0,0,0) scale(1);
  }

  .mist{
    position:absolute; inset:auto 0 0; height:46%; z-index:8; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(210,220,240,.08) 40%, rgba(180,190,210,.16));
    opacity:0; filter:blur(18px);
    transition:opacity 2.4s var(--slow);
  }
  .is-gate .mist, .is-garden .mist, .is-gather .mist, .is-still .mist{ opacity:1; }
  .mist-2{
    position:absolute; left:-10%; right:-10%; bottom:8%; height:28%; z-index:9; pointer-events:none;
    background:radial-gradient(closest-side at 50% 80%, rgba(230,230,245,.16), transparent 70%);
    opacity:0; animation:drift 16s ease-in-out infinite;
  }
  .is-garden .mist-2, .is-gather .mist-2{ opacity:1; }
  @keyframes drift{
    0%,100%{ transform:translateX(-4%); }
    50%{ transform:translateX(5%); }
  }

  /* ---------------- bonjour ---------------- */
  .bonjour{
    position:absolute; inset:0; z-index:50;
    display:grid; place-items:center;
    margin:0;
    font-family:var(--display);
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.6rem, 5.5vw, 2.6rem);
    letter-spacing:.08em;
    color:var(--ivory);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 2.2s var(--slow), transform 2.2s var(--slow), filter 2s var(--slow);
    pointer-events:none;
    text-shadow:0 0 40px rgba(243,234,214,.2);
  }
  .is-bonjour .bonjour{ opacity:1; transform:none; }
  .is-distant .bonjour{ opacity:.0; transform:translateY(-18px); filter:blur(6px); }

  /* ---------------- gate ---------------- */
  .gate-wrap{
    position:absolute; inset:0; z-index:12;
    display:grid; place-items:end center;
    padding-bottom:8vh;
    opacity:0;
    transform:scale(.72) translateY(8vh);
    filter:blur(8px);
    transition:opacity 2.8s var(--slow), transform 3.4s var(--slow), filter 2.8s var(--slow);
    pointer-events:none;
  }
  .is-distant .gate-wrap{
    opacity:.55; transform:scale(.42) translateY(2vh); filter:blur(2px);
  }
  .is-gate .gate-wrap{
    opacity:1; transform:none; filter:none;
  }
  .is-enter .gate-wrap{
    opacity:0; transform:scale(1.55) translateY(-6vh); filter:blur(10px);
    transition-duration:1.8s;
  }
  .gate-wrap svg{ width:min(640px, 96vw); height:auto; display:block; filter:drop-shadow(0 0 28px rgba(201,165,106,.2)); }

  /* ---------------- corridor / candle ---------------- */
  .corridor{
    position:absolute; inset:0; z-index:14;
    opacity:0; pointer-events:none;
    transition:opacity 1.6s var(--slow);
    background:
      radial-gradient(60% 50% at 50% 100%, rgba(255,170,80,.08), transparent 55%),
      linear-gradient(180deg, transparent, rgba(0,0,0,.35));
  }
  .is-candle .corridor, .is-rose .corridor, .is-letter .corridor{ opacity:1; }
  .hall{
    position:absolute; left:50%; top:8%; bottom:0;
    width:min(72vw, 560px); translate:-50% 0;
    background:linear-gradient(180deg, rgba(20,16,28,.0), rgba(18,14,24,.65) 30%, rgba(12,10,16,.82));
    clip-path:polygon(32% 0, 68% 0, 100% 100%, 0 100%);
  }
  .candle{
    position:absolute; left:calc(50% + 42px); bottom:18%;
    width:18px; height:90px; translate:-50% 0;
  }
  .candle .stick{
    position:absolute; left:3px; bottom:0; width:8px; height:42px;
    background:linear-gradient(90deg, #e8d3a4, #fff6df 45%, #cbb07a);
    border-radius:2px 2px 0 0;
  }
  .candle .flame{
    position:absolute; left:50%; bottom:40px; translate:-50% 0;
    width:16px; height:26px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff6c8, #ffb347 55%, rgba(255,100,0,0));
    filter:blur(.3px);
    animation:flicker .16s infinite alternate;
    transform-origin:50% 100%;
  }
  .candle .glow{
    position:absolute; left:50%; bottom:28px; translate:-50% 0;
    width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,70,.28), transparent 68%);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes flicker{
    from{ transform:scaleY(1) rotate(-2deg); filter:brightness(1); }
    to{ transform:scaleY(1.08) rotate(2deg); filter:brightness(1.15); }
  }
  @keyframes breathe{
    0%,100%{ opacity:.7; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.08); }
  }

  .first-rose{
    position:absolute; left:calc(50% - 8px); bottom:26%;
    width:120px; height:160px; translate:-50% 0;
    opacity:0; transform:translateY(16px) scale(.85);
    transition:opacity 1.4s var(--slow), transform 1.6s var(--pop, var(--ease));
    filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));
  }
  .is-candle .first-rose{ opacity:.55; transform:translateY(8px) scale(.9); }
  .is-rose .first-rose, .is-letter .first-rose{
    opacity:1; transform:scale(1.12);
  }

  .envelope{
    position:absolute; left:50%; bottom:11%;
    width:min(220px, 58vw); translate:-50% 0;
    opacity:0; transform:translateY(20px);
    transition:opacity 1.2s var(--slow), transform 1.2s var(--slow);
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));
  }
  .is-letter .envelope{ opacity:1; transform:none; }
  .envelope svg{ width:100%; height:auto; display:block; }
  .envelope.open .flap{ transform:rotateX(180deg); transform-origin:50% 0%; }

  /* ---------------- curtains ---------------- */
  .curtains{
    position:absolute; inset:0; z-index:18;
    pointer-events:none; opacity:0;
    transition:opacity .6s linear;
  }
  .is-curtains .curtains{ opacity:1; }
  .panel{
    position:absolute; top:0; bottom:0; width:52%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 6px, transparent 6px 18px),
      linear-gradient(90deg, #4a2030, #7a3144 40%, #5a2436);
    box-shadow:inset 0 0 80px rgba(0,0,0,.45);
    transition:transform 2.4s var(--slow);
  }
  .panel.left{ left:0; border-right:1px solid rgba(201,165,106,.2); }
  .panel.right{ right:0; border-left:1px solid rgba(201,165,106,.2); }
  .panel::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,230,200,.08), transparent 30%, rgba(0,0,0,.25));
  }
  .is-curtains.open .panel.left{ transform:translateX(-96%); }
  .is-curtains.open .panel.right{ transform:translateX(96%); }

  /* ---------------- garden ---------------- */
  .garden{
    position:absolute; inset:0; z-index:10;
    opacity:0; pointer-events:none;
    transition:opacity 2s var(--slow);
  }
  .is-garden .garden, .is-gather .garden, .is-still .garden{ opacity:1; }
  .ground{
    position:absolute; left:-10%; right:-10%; bottom:-8%; height:42%;
    background:
      radial-gradient(120% 80% at 50% 100%, #1c2a22, #101816 70%, transparent);
    border-radius:50% 50% 0 0;
  }
  .path{
    position:absolute; left:50%; bottom:0; translate:-50% 0;
    width:min(280px, 50vw); height:38%;
    background:linear-gradient(180deg, rgba(180,160,120,.05), rgba(160,140,100,.18));
    clip-path:polygon(46% 0, 54% 0, 92% 100%, 8% 100%);
    opacity:.35;
    transition:opacity 2s var(--slow);
  }
  .is-garden[data-blooms="0"] .path{ opacity:.15; }
  .garden[data-rich="1"] .path{ opacity:.5; }

  .trees{
    position:absolute; inset:0; pointer-events:none;
  }
  .trees svg{ position:absolute; bottom:16%; width:min(48vw, 400px); opacity:.7; }
  .trees .t-left{ left:-8%; }
  .trees .t-right{ right:-10%; transform:scaleX(-1); }
  .trees .t-mid-l{ left:14%; bottom:28%; width:min(28vw, 220px); opacity:.35; }
  .trees .t-mid-r{ right:12%; bottom:30%; width:min(26vw, 200px); opacity:.32; transform:scaleX(-1); }

  .estate{
    position:absolute; left:50%; bottom:46%; z-index:2;
    width:min(52vw, 480px); translate:-50% 0;
    opacity:0; transition:opacity 2.4s var(--slow);
    pointer-events:none;
  }
  .garden.is-hung .estate{ opacity:.22; }

  .fountain{
    position:absolute; left:50%; bottom:24%;
    width:min(220px, 48vw); translate:-50% 0;
    opacity:0; transform:translateY(12px);
    transition:opacity 1.8s var(--slow), transform 1.8s var(--slow);
    filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));
  }
  .garden.is-lit .fountain{ opacity:.9; transform:none; }
  .fountain .water{
    transform-origin:50% 100%;
    animation:spray 2.2s ease-in-out infinite;
  }
  @keyframes spray{
    0%,100%{ transform:scaleY(.92); opacity:.55; }
    50%{ transform:scaleY(1.08); opacity:.9; }
  }

  .flora{
    position:absolute; inset:0; pointer-events:none;
  }
  .bloom{
    position:absolute;
    width:clamp(96px, 20vw, 168px);
    opacity:0;
    transform:scale(.2) translateY(20px);
    filter:blur(6px);
    transform-origin:50% 90%;
  }
  .bloom.in{
    animation:bloomIn 1.8s var(--slow) forwards;
  }
  @keyframes bloomIn{
    0%{ opacity:0; transform:scale(.15) rotate(-16deg) translateY(24px); filter:blur(8px); }
    62%{ opacity:1; transform:scale(1.08) rotate(3deg) translateY(-2px); filter:blur(0); }
    100%{ opacity:1; transform:scale(1) rotate(0) translateY(0); filter:blur(0); }
  }
  .bloom.b1{ left:12%; bottom:22%; }
  .bloom.b2{ right:10%; bottom:24%; }
  .bloom.b3{ left:22%; bottom:32%; }
  .bloom.b4{ right:20%; bottom:36%; }
  .bloom.b5{ left:8%; bottom:40%; }
  .bloom.b6{ right:6%; bottom:42%; }
  .bloom.b7{ left:50%; bottom:18%; translate:-50% 0; width:clamp(90px, 20vw, 160px); }
  .bloom svg{ width:100%; height:auto; display:block; overflow:visible; }

  .wisteria{
    position:absolute; top:-2%; left:0; right:0; height:28%;
    opacity:0; transition:opacity 2s var(--slow);
    background:
      radial-gradient(closest-side at 18% 0%, rgba(170,140,210,.35), transparent 70%),
      radial-gradient(closest-side at 82% 0%, rgba(190,120,170,.3), transparent 70%),
      radial-gradient(closest-side at 50% 0%, rgba(140,160,220,.18), transparent 70%);
    pointer-events:none;
  }
  .garden.is-hung .wisteria{ opacity:.85; }

  /* ---------------- bouquet ---------------- */
  .bouquet{
    position:absolute; left:50%; top:46%; z-index:32;
    width:min(280px, 70vw); translate:-50% -50%;
    opacity:0; transform:scale(.8);
    filter:drop-shadow(0 24px 30px rgba(0,0,0,.45));
    pointer-events:none;
    transition:opacity 2s var(--slow), transform 2.4s var(--slow);
  }
  .is-gather .bouquet, .is-still .bouquet{ opacity:1; transform:scale(1); }
  .is-still .bouquet{ top:30%; width:min(240px, 58vw); opacity:.9; }
  .is-gather .flora .bloom,
  .is-still .flora .bloom,
  .is-gather .fountain,
  .is-still .fountain{
    opacity:0 !important;
    animation:none !important;
    transition:opacity 1.4s var(--slow);
  }
  .is-gather .estate, .is-still .estate{ opacity:.12; }
  .bouquet svg{ width:100%; height:auto; display:block; overflow:visible; }

  /* ---------------- words ---------------- */
  .whisper{
    position:absolute; left:50%; z-index:46;
    width:min(620px, 88vw); translate:-50% 0;
    text-align:center;
    pointer-events:none;
    opacity:0;
    bottom:9%;
    z-index:46;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .whisper.show{ animation:whisperIn 1.6s var(--slow) forwards; }
  .whisper.hide{ animation:whisperOut .9s var(--ease) forwards; }
  @keyframes whisperIn{
    from{ opacity:0; transform:translate(-50%, 12px); filter:blur(6px); }
    to{ opacity:1; transform:translate(-50%, 0); filter:none; }
  }
  @keyframes whisperOut{
    to{ opacity:0; transform:translate(-50%, -10px); filter:blur(4px); }
  }
  .whisper .line{
    margin:0;
    font-family:var(--script);
    font-size:clamp(1.75rem, 6vw, 2.9rem);
    line-height:1.35;
    color:#f7edd8;
    text-shadow:0 8px 30px rgba(0,0,0,.55);
  }
  .whisper .line.majesty{
    font-family:var(--display);
    font-style:italic;
    letter-spacing:.12em;
    font-size:clamp(1.2rem, 3.4vw, 1.7rem);
    text-transform:none;
  }

  .final{
    position:absolute; inset:0; z-index:46;
    display:grid; place-items:center;
    padding:8vh 7vw calc(10vh + env(safe-area-inset-bottom));
    opacity:0; pointer-events:none;
    transition:opacity 2.4s var(--slow);
  }
  .is-still .final{ opacity:1; pointer-events:none; }
  .is-still .garden{ opacity:.45; }
  .final article{
    width:min(520px, 92vw);
    text-align:center;
  }
  .final .seal{
    width:42px; height:42px; margin:0 auto 22px;
    border:1px solid var(--gold-soft); border-radius:50%;
    display:grid; place-items:center;
    color:var(--gold); font-size:.7rem; letter-spacing:.28em;
  }
  .final p{
    font-family:var(--display);
    font-style:italic;
    font-size:clamp(1.15rem, 3.8vw, 1.55rem);
    line-height:1.7;
    color:var(--ivory);
    margin:0 0 .7em;
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.8);
  }
  .final p.sign{
    margin-top:1.6em;
    font-size:clamp(.95rem, 2.8vw, 1.1rem);
    letter-spacing:.16em;
    font-style:normal;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.8;
  }

  /* ---------------- chrome ---------------- */
  .hint{
    position:absolute; left:50%; bottom:calc(18px + env(safe-area-inset-bottom));
    translate:-50% 0; z-index:45;
    font-size:.68rem; letter-spacing:.38em; text-transform:uppercase;
    color:rgba(243,234,214,.28);
    opacity:0; pointer-events:none;
    transition:opacity 1.4s linear;
  }
  .hint.show{ opacity:1; animation:hintPulse 3.2s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{ opacity:.22; } 50%{ opacity:.55; } }

  .sound{
    position:absolute; z-index:60;
    top:calc(14px + env(safe-area-inset-top)); right:14px;
    width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(201,165,106,.28);
    background:rgba(7,11,20,.35);
    color:var(--ivory);
    cursor:pointer;
    opacity:0;
    transition:opacity 1s linear;
    -webkit-tap-highlight-color:transparent;
  }
  .sound.ready{ opacity:.7; }
  .sound:focus-visible{ outline:2px solid var(--gold); }
  .cursor{
    position:fixed; z-index:70; width:18px; height:18px; margin:-9px 0 0 -9px;
    border:1px solid rgba(201,165,106,.7); border-radius:50%;
    pointer-events:none; mix-blend-mode:screen;
    transition:transform .12s linear, opacity .3s linear;
    display:none; opacity:0;
  }
  .cursor i{
    position:absolute; inset:6px; border-radius:50%; background:var(--gold); opacity:.7;
  }
  @media (hover:hover) and (pointer:fine){
    .cursor{ display:block; }
  }

  .sr{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0);
  }

  @media (max-width:520px){
    .moon{ top:6%; right:6%; }
    .whisper{ bottom:7%; }
    .bloom.b5,.bloom.b6{ bottom:46%; }
    .fountain{ bottom:28%; }
    .trees svg{ bottom:22%; opacity:.4; }
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.2s !important;
    }
  }
</style>
</head>
<body>
<div id="world" class="is-bonjour">
  <div class="sky-wash"></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="moon" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="mist-2" aria-hidden="true"></div>

  <p class="bonjour" id="bonjour">Bonjour, ma’am.</p>

  <div class="gate-wrap" aria-hidden="true">

<script>
(() => {
  "use strict";

  const VERSES = [
    "For her majesty,",
    "A voice sweeter than sugar,",
    "A heart warmer than the sun,",
    "A presence more royal than any crown,",
    "A smile prettier than any picture,",
    "A laugh more beautiful than any melody,",
    "Eyes brighter than daylight,",
    "And a spirit that refuses to be tamed."
  ];

  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r=document) => r.querySelector(s);
  const world = $("#world");
  const hint = $("#hint");
  const whisper = $("#whisper");
  const verseEl = $("#verse");
  const live = $("#live");

  const wait = (ms) => new Promise((res) => setTimeout(res, REDUCED ? Math.min(ms, 240) : ms));

  /* ============================================================
     Original music — a small waltz. Nothing copyrighted.
     ============================================================ */
  const Music = (() => {
    let ac, master, on = true, started = false, timer, intensity = 0.18;

    function envGain(t, a, d, g){
      const n = ac.createGain();
      n.gain.setValueAtTime(0.0001, t);
      n.gain.exponentialRampToValueAtTime(g, t + a);
      n.gain.exponentialRampToValueAtTime(0.0001, t + d);
      return n;
    }
    function tone(type, freq, t, dur, g, dest){
      const o = ac.createOscillator();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      const e = envGain(t, 0.02, dur, g);
      o.connect(e).connect(dest);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function pad(freq, t){
      const o1 = ac.createOscillator(), o2 = ac.createOscillator();
      const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 720;
      const g = ac.createGain(); g.gain.value = 0.028 * (0.6 + intensity);
      o1.type = "triangle"; o2.type = "sine";
      o1.frequency.value = freq; o2.frequency.value = freq * 1.003;
      o1.connect(f); o2.connect(f); f.connect(g).connect(master);
      o1.start(t); o2.start(t);
      o1.stop(t + 3.2); o2.stop(t + 3.2);
    }
    function harp(freq, t){
      const o = ac.createOscillator();
      o.type = "sine"; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 0.98, t + 1.1);
      const e = envGain(t, 0.01, 1.2, 0.045 * intensity);
      o.connect(e).connect(master);
      o.start(t); o.stop(t + 1.3);
    }
    const bass = [146.83, 174.61, 196.00, 130.81];
    const melody = [
      [293.66, 349.23, 392.00],
      [349.23, 392.00, 440.00],
      [392.00, 329.63, 293.66],
      [261.63, 329.63, 392.00]
    ];
    function bar(t, i){
      pad(bass[i], t);
      tone("sine", bass[i], t, 1.6, 0.07 * intensity, master);
      melody[i].forEach((f, k) => {
        tone("triangle", f, t + k * 0.48, 0.7, 0.05 * intensity, master);
        if (k === 2) harp(f * 2, t + 0.9);
      });
    }
    function loop(){
      if (!on || !ac) return;
      const t0 = ac.currentTime + 0.08;
      const beat = 0.48;
      for (let i = 0; i < 4; i++) bar(t0 + i * beat * 3, i);
      timer = setTimeout(loop, 4 * beat * 3 * 1000);
    }

    return {
      async start(){
        if (started || !on) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0;
        master.connect(ac.destination);
        if (ac.state === "suspended") await ac.resume();
        started = true;
        master.gain.linearRampToValueAtTime(0.9, ac.currentTime + 3.5);
        loop();
      },
      setIntensity(n){ intensity = n; },
      async toggle(){
        on = !on;
        if (!started && on) await this.start();
        if (master){
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.linearRampToValueAtTime(on ? 0.9 : 0.0001, ac.currentTime + 0.4);
        }
        if (!on){ clearTimeout(timer); }
        else if (started) loop();
        return on;
      },
      soften(){
        if (!master) return;
        intensity = 0.1;
        master.gain.linearRampToValueAtTime(0.35, ac.currentTime + 3);
      }
    };
  })();

  /* ============================================================
     Stars, fireflies, petals
     ============================================================ */
  const sky = $("#sky"), fx = $("#fx");
  const sctx = sky.getContext("2d"), fctx = fx.getContext("2d");
  let W = 0, H = 0, stars = [], flies = [], petals = [], raf;
  const dpr = () => Math.min(devicePixelRatio || 1, 2);

  function size(){
    W = innerWidth; H = innerHeight;
    [sky, fx].forEach((c) => {
      const r = dpr();
      c.width = Math.floor(W * r); c.height = Math.floor(H * r);
      c.style.width = W + "px"; c.style.height = H + "px";
      c.getContext("2d").setTransform(r, 0, 0, r, 0, 0);
    });
  }
  size();
  addEventListener("resize", size);

  function seedStars(){
    const n = innerWidth < 520 ? 70 : 140;
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.62,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(), s: 0.003 + Math.random() * 0.008
    }));
  }
  seedStars();

  function addFlies(n){
    for (let i = 0; i < n; i++){
      flies.push({
        x: Math.random() * W, y: H * 0.35 + Math.random() * H * 0.5,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.2,
        p: Math.random() * Math.PI * 2,
        a: 0
      });
    }
  }
  function petalBurst(x, y, n=12){
    if (REDUCED) return;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      petals.push({
        x, y,
        vx: Math.cos(a) * (0.4 + Math.random() * 1.4),
        vy: -1.2 - Math.random() * 1.6,
        r: 4 + Math.random() * 6,
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 0.08,
        life: 1,
        c: Math.random() > 0.5 ? "#e7b7b4" : "#f3ead6"
      });
    }
  }
  function rainPetals(on){
    rain = on;
  }
  let rain = false, gardenFX = false;

  function frame(){
    sctx.clearRect(0,0,W,H);
    fctx.clearRect(0,0,W,H);
    stars.forEach((st) => {
      st.a += st.s; const o = 0.25 + Math.sin(st.a) * 0.25;
      sctx.fillStyle = `rgba(243,234,214,${o})`;
      sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, Math.PI*2); sctx.fill();
    });
    if (gardenFX){
      flies.forEach((f) => {
        f.p += 0.02; f.x += f.vx + Math.sin(f.p) * 0.15; f.y += f.vy;
        if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
        if (f.y < H*0.2) f.y = H*0.8; if (f.y > H*0.9) f.y = H*0.35;
        const a = 0.25 + Math.sin(f.p * 2) * 0.35;
        fctx.fillStyle = `rgba(255, 220, 140, ${a})`;
        fctx.beginPath(); fctx.arc(f.x, f.y, 2.2, 0, Math.PI*2); fctx.fill();
        fctx.fillStyle = `rgba(255, 240, 180, ${a * 0.45})`;
        fctx.beginPath(); fctx.arc(f.x, f.y, 6, 0, Math.PI*2); fctx.fill();
      });
    }
    if (rain && petals.length < 40 && Math.random() < 0.12){
      petals.push({
        x: Math.random() * W, y: -10,
        vx: -0.4 + Math.random() * 0.3, vy: 0.5 + Math.random() * 0.7,
        r: 3 + Math.random() * 5, rot: Math.random()*6, vr: 0.03,
        life: 1, c: Math.random()>0.4 ? "#e7b7b4" : "#f6e6d0"
      });
    }
    for (let i = petals.length - 1; i >= 0; i--){
      const p = petals[i];
      p.vy += 0.012; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.003;
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.globalAlpha = Math.max(0, p.life);
      fctx.fillStyle = p.c;
      fctx.beginPath(); fctx.ellipse(0,0,p.r, p.r*0.55, 0, 0, Math.PI*2); fctx.fill();
      fctx.restore();
      if (p.life <= 0 || p.y > H + 20) petals.splice(i,1);
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  /* ============================================================
     Flowers
     ============================================================ */
  function flowerSVG(kind){
    const wrap = (inner, vb="0 0 80 110") =>
      `<svg viewBox="${vb}" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    const stem = `<path d="M40 52 C38 78 44 100 40 110" stroke="#4d6a4c" stroke-width="2"/>
      <path d="M40 78 C22 70 18 84 28 86" stroke="#4d6a4c" stroke-width="1.4" fill="#5f8058" opacity=".8"/>`;
    const kinds = {
      white: wrap(`${stem}
        <g transform="translate(40 44)">
          <circle r="8" fill="#f7e7c8"/>
          ${[0,45,90,135,180,225,270,315].map(a=>`<ellipse rx="9" ry="16" fill="#f4ead6" stroke="#e2d0b0" transform="rotate(${a})" opacity=".92"/>`).join("")}
          <circle r="5" fill="#e8c56b"/>
        </g>`),
      jasmine: wrap(`${stem}
        <g transform="translate(40 42)">
          ${[0,72,144,216,288].map(a=>`<ellipse rx="7" ry="15" fill="#fff6ea" stroke="#ead9c4" transform="rotate(${a})" />`).join("")}
          <circle r="4" fill="#f0d36a"/>
        </g>`),
      sun: wrap(`${stem}
        <g transform="translate(40 44)">
          ${[0,40,80,120,160,200,240,280,320].map(a=>`<ellipse rx="6" ry="16" fill="#e39a4a" stroke="#c47a30" transform="rotate(${a})"/>`).join("")}
          <circle r="9" fill="#f3c14b"/>
        </g>`),
      iris: wrap(`${stem}
        <g transform="translate(40 46)">
          <path d="M0 6 C-18 -10 -16 -28 0 -22 C16 -28 18 -10 0 6" fill="#6d4ea8"/>
          <path d="M-2 8 C-22 2 -20 28 -6 24" fill="#8b67c4"/>
          <path d="M2 8 C22 2 20 28 6 24" fill="#8b67c4"/>
          <circle r="3" fill="#e8c56b"/>
        </g>`),
      peony: wrap(`${stem}
        <g transform="translate(40 44)">
          ${[0,30,60,90,120,150,180,210,240,270,300,330].map((a,i)=>`<ellipse rx="${8 + (i % 3)}" ry="15" fill="${i % 2 ? "#e7a3a0" : "#f0c3c0"}" transform="rotate(${a})" opacity=".9"/>`).join("")}
          <circle r="6" fill="#d36a78"/>
        </g>`),
      lily: wrap(`${stem}
        <g transform="translate(40 40)">
          ${[0,60,120,180,240,300].map(a=>`<path d="M0 4 C-6 -18 6 -18 0 4" fill="#f7dfe4" stroke="#e4b7c2" transform="rotate(${a})"/>`).join("")}
          <path d="M0 0 L0 -16" stroke="#c9a56a"/><circle cy="-4" r="3" fill="#e8c56b"/>
        </g>`),
      moon: wrap(`${stem}
        <g transform="translate(40 44)">
          ${[0,51,102,153,204,255,306].map(a=>`<ellipse rx="6" ry="17" fill="#f7f1dc" stroke="#ddd0b0" transform="rotate(${a})" opacity=".95"/>`).join("")}
          <circle r="4.5" fill="#fff6c2"/>
        </g>`),
      wild: wrap(`${stem}
        <g transform="translate(40 44)">
          ${[0,52,104,156,208,260,312].map(a=>`<ellipse rx="8" ry="16" fill="#9b2f45" stroke="#7a2234" transform="rotate(${a})"/>`).join("")}
          <circle r="6" fill="#e8c56b"/>
        </g>`)
    };
    return kinds[kind];
  }

  const BLOOMS = [
    { kind:"jasmine", cls:"b1" },
    { kind:"sun",     cls:"b2" },
    { kind:"iris",    cls:"b3" },
    { kind:"peony",   cls:"b4" },
    { kind:"lily",    cls:"b5" },
    { kind:"moon",    cls:"b6" },
    { kind:"wild",    cls:"b7" }
  ];

  $("#first-rose").innerHTML = flowerSVG("white");
  $("#flora").innerHTML = BLOOMS.map((b,i) =>
    `<div class="bloom ${b.cls}" data-i="${i}">${flowerSVG(b.kind)}</div>`
  ).join("");

  $("#bouquet").innerHTML = `
    <svg viewBox="0 0 200 240">
      <defs>
        <linearGradient id="rib" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c9a56a"/><stop offset="1" stop-color="#7a2433"/>
        </linearGradient>
      </defs>
      <g transform="translate(100 108)">
        <ellipse rx="8" ry="18" fill="#9b2f45" transform="rotate(-28) translate(0 -28)"/>
        <ellipse rx="9" ry="20" fill="#e7a3a0" transform="rotate(18) translate(6 -30)"/>
        <ellipse rx="8" ry="18" fill="#6d4ea8" transform="rotate(-8) translate(-18 -22)"/>
        <ellipse rx="10" ry="22" fill="#f4ead6" transform="rotate(8) translate(16 -20)"/>
        <ellipse rx="9" ry="20" fill="#e39a4a" transform="rotate(-40) translate(-6 -18)"/>
        <ellipse rx="8" ry="17" fill="#f7dfe4" transform="rotate(42) translate(2 -16)"/>
        <ellipse rx="9" ry="19" fill="#fff6ea" transform="rotate(0) translate(0 -36)"/>
        <circle cy="-18" r="10" fill="#e8c56b"/>
      </g>
      <path d="M100 118 C92 170 108 210 98 232" stroke="#4d6a4c" stroke-width="4" fill="none"/>
      <path d="M78 128 C100 148 122 128 122 128 C112 158 88 158 78 128" fill="url(#rib)"/>
      <path d="M70 132 C40 150 44 176 78 168" fill="none" stroke="url(#rib)" stroke-width="3"/>
      <path d="M130 132 C160 150 156 176 122 168" fill="none" stroke="url(#rib)" stroke-width="3"/>
    </svg>`;

  /* ============================================================
     Journey
     ============================================================ */
  let beat = "bonjour";
  let locked = true;
  let bloomCount = 0;
  let hintTimer;

  function setBeat(name){
    beat = name;
    world.className = "is-" + name;
  }
  function say(text, majesty=false){
    verseEl.textContent = text;
    verseEl.className = "line" + (majesty ? " majesty" : "");
    whisper.classList.remove("hide");
    whisper.classList.add("show");
    live.textContent = text;
  }
  function unsay(){
    whisper.classList.remove("show");
    whisper.classList.add("hide");
  }
  function showHint(text){
    clearTimeout(hintTimer);
    hint.textContent = text;
    hint.classList.remove("show");
    hintTimer = setTimeout(() => hint.classList.add("show"), REDUCED ? 200 : 2200);
  }
  function hideHint(){
    hint.classList.remove("show");
    clearTimeout(hintTimer);
  }
  function unlock(){
    locked = false;
  }

  async function begin(){
    await wait(700);
    live.textContent = "Bonjour, ma’am.";
    await wait(2400);
    locked = false;
    showHint("touch the night");
  }

  async function toDistant(){
    locked = true; hideHint();
    Music.start();
    Music.setIntensity(0.12);
    $("#sound").classList.add("ready");
    setBeat("distant");
    await wait(1600);
    locked = false;
    showHint("come closer");
  }

  async function toGate(){
    locked = true; hideHint();
    Music.setIntensity(0.16);
    setBeat("gate");
    await wait(1400);
    locked = false;
    showHint("the gate is open");
  }

  async function enter(){
    locked = true; hideHint();
    setBeat("enter");
    await wait(1700);
    setBeat("candle");
    await wait(900);
    locked = false;
    showHint("a little further");
  }

  async function bloomRose(){
    locked = true; hideHint();
    setBeat("rose");
    $("#first-rose").classList.add("bloomed");
    petalBurst(innerWidth/2, innerHeight * 0.62, 18);
    await wait(1400);
    locked = false;
    showHint("");
  }

  async function letter(){
    locked = true; hideHint();
    setBeat("letter");
    await wait(700);
    $("#envelope").classList.add("open");
    await wait(800);
    say(VERSES[0], true);
    await wait(1600);
    locked = false;
    showHint("continue");
  }

  async function curtains(){
    locked = true; hideHint(); unsay();
    setBeat("curtains");
    await wait(500);
    $("#curtains").classList.add("open");
    world.classList.add("open");
    await wait(1600);
    setBeat("garden");
    $("#garden").classList.add("is-lit");
    gardenFX = true; addFlies(innerWidth < 520 ? 14 : 28);
    rainPetals(true);
    Music.setIntensity(0.28);
    await wait(900);
    locked = false;
    showHint("walk with me");
  }

  async function bloomNext(){
    locked = true; hideHint(); unsay();
    const i = bloomCount;
    const node = document.querySelectorAll(".bloom")[i];
    if (node){
      node.classList.add("in");
      const r = node.getBoundingClientRect();
      petalBurst(r.left + r.width/2, r.top + r.height/2, 16);
    }
    bloomCount++;
    world.dataset.blooms = String(bloomCount);
    if (bloomCount >= 3) $("#garden").classList.add("is-hung");
    if (bloomCount >= 5) Music.setIntensity(0.34);
    await wait(700);
    say(VERSES[bloomCount]);
    await wait(1100);
    if (bloomCount >= BLOOMS.length){
      await wait(1400);
      await gather();
      return;
    }
    locked = false;
    showHint("");
  }

  async function gather(){
    locked = true; hideHint(); unsay();
    rainPetals(true);
    Music.soften();
    setBeat("gather");
    petalBurst(innerWidth/2, innerHeight * 0.48, 60);
    live.textContent = "A bouquet, gathered from the night.";
    await wait(3200);
    setBeat("still");
    await wait(800);
    live.textContent = "I could not give you another century.";
  }

  const sequence = {
    bonjour: toDistant,
    distant: toGate,
    gate: enter,
    candle: bloomRose,
    rose: letter,
    letter: curtains,
    garden: bloomNext
  };

  function advance(){
    if (locked) return;
    if (beat === "garden"){ bloomNext(); return; }
    const fn = sequence[beat];
    if (fn) fn();
  }

  world.addEventListener("click", (e) => {
    if (e.target.closest(".sound")) return;
    Music.start();
    advance();
  });
  addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){
      e.preventDefault(); Music.start(); advance();
    }
  });

  /* cursor + parallax */
  const cur = $("#cursor");
  addEventListener("pointermove", (e) => {
    cur.style.opacity = "1";
    cur.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    if (!world.classList.contains("is-garden") && !world.classList.contains("is-gather")) return;
    const nx = (e.clientX / W - 0.5) * 12;
    const ny = (e.clientY / H - 0.5) * 8;
    $("#garden").style.transform = `translate3d(${nx}px, ${ny}px, 0)`;
    $(".moon").style.transform = `translate3d(${-nx * 0.4}px, ${-ny * 0.3}px, 0)`;
  });

  $("#sound").addEventListener("click", async (e) => {
    e.stopPropagation();
    const on = await Music.toggle();
    $("#sound").setAttribute("aria-pressed", String(on));
    $("#sound").textContent = on ? "♪" : "×";
  });

  begin();
})();
</script>
</body>
</html>
